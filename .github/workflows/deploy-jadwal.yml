name: Auto-update jadwal dokter

# Cek tiap 10 menit: kalau jadwal di Google Sheet berubah, situs dibangun ulang
# dan di-deploy ke Netlify — semuanya di server GitHub, tanpa komputer lokal.
on:
  schedule:
    - cron: "*/10 * * * *"   # UTC; GitHub memakai UTC, jadi tiap 10 menit
  push:
    branches: [main]         # setiap push ke main -> langsung cek & deploy
  workflow_dispatch:          # bisa dijalankan manual dari tab Actions

permissions:
  contents: write             # untuk menyimpan sidik jari + dokter.html + STATUS.txt

concurrency:
  group: deploy-jadwal
  cancel-in-progress: false

jobs:
  jadwal:
    runs-on: ubuntu-latest
    env:
      # URL CSV publik hasil "Publish to web" dari Google Sheet.
      # Boleh diisi sebagai Repository variable (Settings -> Secrets and variables -> Actions
      # -> Variables) ATAU sebagai secret. Keduanya didukung.
      SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL != '' && vars.SHEET_CSV_URL || secrets.SHEET_CSV_URL }}
      NETLIFY_SITE_ID: b80d5197-39b0-4721-9ac1-39f7afdf7d26

    steps:
      - name: Ambil repo
        uses: actions/checkout@v4

      - name: Ambil jadwal dari Google Sheet & bandingkan sidik jari
        id: cek
        run: |
          set -uo pipefail

          if [ -z "${SHEET_CSV_URL:-}" ]; then
            echo "SEBAB=kosong" >> "$GITHUB_ENV"
            echo "::error::SHEET_CSV_URL belum diisi (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          echo "SEBAB=tidak-kosong" >> "$GITHUB_ENV"
          echo "PANJANG_URL=${#SHEET_CSV_URL}" >> "$GITHUB_ENV"
          case "$SHEET_CSV_URL" in
            https://docs.google.com/*) echo "POLA_URL=google" >> "$GITHUB_ENV" ;;
            *) echo "POLA_URL=lain" >> "$GITHUB_ENV" ;;
          esac

          # URL "Publish to web" berformat HTML (pubhtml) -> ubah jadi CSV (pub?output=csv),
          # supaya variable yang masih menyimpan link "Web page" tetap menghasilkan CSV.
          case "$SHEET_CSV_URL" in
            *pubhtml*)
              SHEET_CSV_URL="${SHEET_CSV_URL%pubhtml*}pub?output=csv"
              echo "SHEET_CSV_URL=$SHEET_CSV_URL" >> "$GITHUB_ENV"
              ;;
          esac

          # Unduh dengan coba-ulang: unduhan pertama ke Google kadang masih HTML
          # "menyiapkan", baru unduhan berikutnya benar-benar CSV.
          KODE="000"
          for i in 1 2 3; do
            KODE=$(curl -sSL --max-time 60 -o /tmp/jadwal.csv -w "%{http_code}" "$SHEET_CSV_URL" || echo "000")
            if head -1 /tmp/jadwal.csv 2>/dev/null | grep -qi "poli"; then
              break
            fi
            sleep 5
          done
          TIPE=$(curl -sSLI --max-time 30 "$SHEET_CSV_URL" | tr -d '\r' | awk 'tolower($1)=="content-type:"{print $2; exit}')
          echo "KODE_HTTP=$KODE" >> "$GITHUB_ENV"
          echo "TIPE_ISI=${TIPE:-tidak-ada}" >> "$GITHUB_ENV"

          if head -1 /tmp/jadwal.csv 2>/dev/null | grep -qi "poli"; then
            echo "BERKOLOM_POLI=ya" >> "$GITHUB_ENV"
          else
            echo "BERKOLOM_POLI=tidak" >> "$GITHUB_ENV"
            echo "::error::Isi yang diunduh bukan CSV jadwal (HTTP $KODE, tipe ${TIPE:-?}). Batal demi keamanan."
            exit 1
          fi

          BARU=$(sha256sum /tmp/jadwal.csv | cut -d' ' -f1)
          LAMA=$(cat .jadwal-terakhir 2>/dev/null || echo "-")
          echo "sidik jari baru: $BARU"
          echo "sidik jari lama: $LAMA"
          if [ "$BARU" = "$LAMA" ]; then
            echo "berubah=0" >> "$GITHUB_OUTPUT"
            echo "Tidak ada perubahan — tidak perlu deploy."
          else
            echo "$BARU" > /tmp/sidik-baru
            echo "berubah=1" >> "$GITHUB_OUTPUT"
            echo "Ada perubahan — lanjut build & deploy."
          fi

      - name: Bangun ulang dokter.html
        if: steps.cek.outputs.berubah == '1'
        run: |
          set -euo pipefail
          python3 tools/fetch-google-sheet.py "$SHEET_CSV_URL"
          python3 tools/banding-jadwal.py | tail -3 || true

      - name: Siapkan folder publik
        if: steps.cek.outputs.berubah == '1'
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist/assets
          cp ./*.html dist/
          cp assets/style.css assets/main.js assets/logo.png dist/assets/
          du -sh dist

      - name: Deploy ke Netlify
        if: steps.cek.outputs.berubah == '1'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo "SEBAB=token-netlify-kosong" >> "$GITHUB_ENV"
            echo "::error::secret NETLIFY_AUTH_TOKEN belum diisi."
            exit 1
          fi
          # npx dipakai supaya tidak bergantung pada izin npm global di runner
          npx --yes netlify-cli@latest deploy --prod --dir dist \
            --message "Auto (GitHub Actions): jadwal dokter"

      - name: Simpan sidik jari & dokter.html
        if: steps.cek.outputs.berubah == '1'
        run: |
          set -euo pipefail
          cp /tmp/sidik-baru .jadwal-terakhir
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .jadwal-terakhir dokter.html
          git commit -m "chore(auto): perbarui jadwal dokter $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" || echo "tidak ada yang berubah untuk di-commit"
          git push

      - name: Ringkasan
        run: |
          if [ "${{ steps.cek.outputs.berubah }}" = "1" ]; then
            echo "✅ Jadwal diperbarui dan situs sudah di-deploy."
          else
            echo "⏸️  Tidak ada perubahan pada jadwal."
          fi

      # Log GitHub tidak bisa dibaca tanpa login, jadi sebab kegagalan ditulis ke repo
      # (hanya metadata teknis — tidak memuat isi URL maupun token).
      - name: Catat sebab kegagalan (agar bisa didiagnosis dari luar)
        if: failure()
        run: |
          {
            echo "waktu_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "alasan_awal: ${SEBAB:-tidak diketahui}"
            echo "panjang_url: ${PANJANG_URL:-0}"
            echo "pola_url: ${POLA_URL:-tidak diperiksa}"
            echo "berkolom_poli: ${BERKOLOM_POLI:-tidak}"
            # Ukur ulang di sini supaya angkanya pasti terekam (tidak mengandalkan GITHUB_ENV).
            if [ -n "${SHEET_CSV_URL:-}" ]; then
              echo "kode_http: $(curl -sSL -o /tmp/cek.csv -w '%{http_code}' --max-time 30 "$SHEET_CSV_URL" || echo gagal)"
              echo "content_type: $(curl -sSLI --max-time 20 "$SHEET_CSV_URL" | tr -d '\r' | awk 'tolower($1)=="content-type:"{print $2; exit}')"
              echo "ukuran_isi: $(wc -c < /tmp/cek.csv 2>/dev/null || echo 0) byte"
              echo "awal_isi: $(head -c 40 /tmp/cek.csv 2>/dev/null | tr -d '\n\r' | tr -d '<>')"
              echo "ada_d_e: $(case "$SHEET_CSV_URL" in *"/d/e/"*) echo ya;; *) echo tidak;; esac)"
              echo "akhiran_url: $(printf '%s' "$SHEET_CSV_URL" | rev | cut -c1-18 | rev)"
            fi
          } > STATUS.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.txt
          git commit -m "chore(auto): catatan kegagalan build [skip ci]" || true
          git push || true
